<!DOCTYPE html>
<!-- vertciti chat frontend. vertciti DNA 浅色机构版 + 中英双语。
     No inline script or style: the page runs under a strict CSP (serve.py).
     TODO(brand): 页面标题/品牌名为 interim 描述性命名"vertciti 智能助手"，终名走品牌设计组＋GC 确认后替换。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- empty = same host on port 8120; set to the API origin in production -->
<meta name="vc-api-base" content="">
<title>vertciti 智能助手</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="shortcuts.js"></script>
</head>
<body>
<a class="skip" href="#input" data-i18n="skip">跳到输入框</a>
<div id="pageError" class="page-error" role="alert" hidden></div>

<header class="topbar">
  <div class="brand">vertciti<span class="dot">.</span></div>
  <div class="title"><span data-i18n="title">智能助手</span> <span class="assistant-en">Assistant</span></div>
  <div class="right">
    <span id="status" class="status" role="status" aria-live="polite" data-state="checking">
      <span class="sq" aria-hidden="true"></span><span id="statusText" data-i18n="stChecking">检查中…</span>
    </span>
    <button type="button" class="langtoggle" id="langToggle"></button>
  </div>
</header>

<main class="chat" id="main">
  <div class="toolbar">
    <button type="button" id="newChat" class="tool" data-i18n="newChat">新对话</button>
    <details id="historyBox" class="history">
      <summary data-i18n="history">历史对话</summary>
      <ul id="historyList" class="history-list"></ul>
    </details>
    <span class="spacer"></span>
    <button type="button" id="deleteChat" class="tool tool-danger" data-i18n="del" hidden>删除本对话</button>
  </div>

  <div id="welcome" class="welcome">
    <p class="w-eyebrow" data-i18n="welcomeEyebrow">免费 · 无需注册</p>
    <h1 class="w-title" data-i18n="welcome">问点什么，vertciti 直接回答。</h1>
    <div class="sug-row">
      <button type="button" class="sug" data-i18n="sug1">帮我比较三家 LLM API 的价格</button>
      <button type="button" class="sug" data-i18n="sug2">把这段话翻译成地道英文</button>
      <button type="button" class="sug" data-i18n="sug3">解释什么是 cap rate</button>
    </div>
  </div>
  <div id="messages" class="messages" aria-live="polite" aria-relevant="additions"></div>
  <div id="ctaRow" class="cta-row" hidden></div>
  <form id="composer" class="composer">
    <label for="input" class="vh" data-i18n="inputLabel">你的消息</label>
    <input id="input" type="text" placeholder="问点什么…（免费，无需注册）" data-i18n-ph="ph"
           autocomplete="off" maxlength="20000">
    <button type="submit" id="sendBtn" data-i18n="send">发送</button>
    <button type="button" id="stopBtn" class="stop" data-i18n="stop" hidden>停止</button>
  </form>
  <p id="meter" class="meter" aria-live="polite"></p>
</main>

<footer class="foot">
  <span id="footText">免费体验</span>
  <button type="button" id="helpBtn" class="linkish" data-i18n="shortcuts">快捷键</button>
</footer>

<dialog id="helpDialog" class="dialog" aria-labelledby="helpTitle">
  <h2 id="helpTitle" data-i18n="shortcuts">快捷键</h2>
  <dl id="helpList" class="keys"></dl>
  <form method="dialog"><button type="submit" data-i18n="close">关闭</button></form>
</dialog>

<dialog id="paletteDialog" class="dialog" aria-labelledby="paletteTitle">
  <h2 id="paletteTitle" class="vh" data-i18n="palette">指令面板</h2>
  <label for="paletteInput" class="vh" data-i18n="palette">指令面板</label>
  <input id="paletteInput" type="text" autocomplete="off" data-i18n-ph="palettePh"
         role="combobox" aria-controls="paletteList" aria-expanded="true">
  <ul id="paletteList" class="palette-list" role="listbox"></ul>
</dialog>

<script src="app.js"></script>
</body>
</html>
