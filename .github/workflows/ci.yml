# Source idea: actions/starter-workflows (CI concept). Tailored for this repo.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff
      - name: Ruff lint (advisory)
        continue-on-error: true
        run: ruff check .
      - name: Run tests
        run: pytest -q

  contrast:
    name: Contrast (WCAG AA, light/dark, phone/desktop)
    # ubuntu-24.04, not -latest: Playwright 1.56 cannot install Chromium on ubuntu 26.04 runners
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Contrast gate
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: ci/check-contrast.sh
