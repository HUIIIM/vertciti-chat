# Source idea: actions/starter-workflows (CI concept). Tailored for this repo.
# Every third-party action is pinned by full commit SHA (tag in the comment);
# Dependabot keeps the pins current. Every gate below is blocking.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python (ruff, mypy, pytest, gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Traceability matrix is current
        run: python ci/trace_matrix.py --check
      - name: M1 zero-dependency gate
        run: bash ci/m1-gate.sh
      - name: Licence gate (fail closed)
        run: python ci/license-scan.py --strict

  frontend:
    name: Frontend (node tests, syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build

  browser:
    name: Browser (contrast WCAG AA + end-to-end)
    # ubuntu-24.04, not -latest: Playwright 1.56 cannot install Chromium on ubuntu 26.04 runners
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install backend (hash-locked) and Playwright (lockfile)
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r backend/requirements.txt
          (cd ci && npm ci --ignore-scripts && npx playwright install --with-deps chromium)
      - name: Contrast gate
        env:
          NODE_PATH: ci/node_modules
        run: ci/check-contrast.sh
      - name: End-to-end gate
        env:
          NODE_PATH: ci/node_modules
          SHOTS: ${{ runner.temp }}
        run: ci/check-e2e.sh
