# Source: ossf/scorecard-action workflow example (OpenSSF).
# NOTE: SARIF upload needs code scanning (GHAS) on private repos; gated accordingly.
# Scorecard itself scores branch protection, pinned deps, SAST, security policy,
# dependabot presence, token permissions, etc.
name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
