# Source: ossf/scorecard-action workflow example (OpenSSF).
# NOTE: SARIF upload needs code scanning (GHAS) on private repos; gated accordingly.
# Scorecard itself scores branch protection, pinned deps, SAST, security policy,
# dependabot presence, token permissions, etc.
name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
