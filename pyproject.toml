# Tool configuration only; the backend is not packaged.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(*ids): requirement / SOTA clause ids this test verifies (see ci/trace_matrix.py)",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "S", "FURB", "EXE"]
ignore = [
    "S101",   # assert is how pytest works
    "S311",   # no cryptographic use of `random`
    "RUF001", # CJK punctuation in user-facing strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603"]
"scripts/**" = ["S603", "S607"]
"ci/**" = ["S310", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
files = ["backend/app"]
mypy_path = "backend"
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
